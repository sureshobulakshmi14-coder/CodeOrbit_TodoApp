<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <h1>My To-Do List</h1>
  <p class="sub">Add, edit and delete tasks. Your tasks are saved in the browser.</p>

  <form id="taskForm">
    <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="120" autocomplete="off" required>
    <button type="submit" class="btn primary" id="addBtn">Add</button>
  </form>

  <div class="filters">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="active">Pending</button>
    <button class="chip" data-filter="done">Completed</button>
  </div>

  <ul id="taskList"></ul>
  <p id="empty" class="empty">No tasks yet. Add your first task!</p>

  <div class="footer-row">
    <span id="count">0 tasks left</span>
    <button class="link" id="clearDone">Clear completed</button>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
